[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "1322-python"
version = "0.1.0"
description = "Unified async Python client for the 1322 real-time social monitoring API (X, Instagram, Truth Social, YouTube, Binance Square, News)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "SisoSol" }]
keywords = [
  "1322",
  "websocket",
  "twitter",
  "x",
  "instagram",
  "truth-social",
  "youtube",
  "binance",
  "async",
  "realtime",
  "social-media-monitoring",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Communications :: Chat",
  "Typing :: Typed",
  "Framework :: AsyncIO",
]
dependencies = [
  "aiohttp>=3.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "build>=1.0"]

[project.urls]
Homepage = "https://1322.io"
Documentation = "https://1322.io/docs"
Repository = "https://github.com/SisoSol/1322-python"
Issues = "https://github.com/SisoSol/1322-python/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/client1322"]

[tool.pytest.ini_options]
testpaths = ["tests"]
